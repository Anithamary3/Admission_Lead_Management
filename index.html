<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admission Lead Tracker</title>
<style>
  :root{
    --navy:#1F3A5F; --navy-dk:#152A45; --amber:#E8A33D; --amber-dk:#C6862A;
    --ink:#1B1F27; --muted:#5B6472; --line:#DDE1E6; --bg:#F7F8FA; --card:#FFFFFF;
    --ok:#2F7D5A; --warn:#B3443B; --ok-bg:#E9F4EF; --warn-bg:#FBEBE9; --pend-bg:#FFF4E0; --pend:#9A6B15;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  header{background:var(--navy);color:#fff;padding:18px 20px calc(18px + env(safe-area-inset-top,0px));}
  header h1{margin:0;font-size:20px;font-weight:650;letter-spacing:.2px;}
  header p{margin:4px 0 0;font-size:13px;color:#C7D3E3;}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px;}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .stat .n{font-size:22px;font-weight:700;color:var(--navy);}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;}
  .panel h2{margin:0 0 12px;font-size:15px;font-weight:650;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:36px;}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  button{cursor:pointer;border:none;border-radius:7px;padding:9px 16px;font-size:13.5px;font-weight:600;font-family:inherit;}
  .btn-primary{background:var(--amber);color:var(--navy-dk);}
  .btn-primary:hover{background:var(--amber-dk);}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .filters select,.filters input{width:auto;min-width:140px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:hover{background:#FAFBFC;}
  .tbl-wrap{overflow-x:auto;}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:650;white-space:nowrap;}
  .b-new{background:var(--pend-bg);color:var(--pend);}
  .b-contacted{background:#E7EEF7;color:var(--navy);}
  .b-followup{background:var(--pend-bg);color:var(--pend);}
  .b-converted{background:var(--ok-bg);color:var(--ok);}
  .b-lost{background:var(--warn-bg);color:var(--warn);}
  .age-hot{color:var(--warn);font-weight:650;}
  .expand{background:#FAFBFC;}
  .expand td{padding:12px 14px;}
  .hist{font-size:12.5px;color:var(--muted);margin:0 0 8px;padding-left:0;list-style:none;}
  .hist li{padding:4px 0;border-bottom:1px dashed var(--line);}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13.5px;}
  .link-btn{background:none;border:none;color:var(--navy);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;}
  .small{font-size:12px;color:var(--muted);}
  @media(max-width:640px){ .stats{grid-template-columns:repeat(2,1fr);} th:nth-child(4),td:nth-child(4){display:none;} }
</style>
</head>
<body>
<header><h1>Admission Lead Tracker</h1><p>Capture, assign, and follow up on admission enquiries end to end</p></header>
<div class="wrap">

  <div class="stats" id="stats"></div>

  <div class="panel">
    <h2>Add a lead</h2>
    <div class="grid" id="form">
      <div><label>Name*</label><input id="f-name"></div>
      <div><label>Phone*</label><input id="f-phone"></div>
      <div><label>Course interested</label><input id="f-course"></div>
      <div><label>Source</label>
        <select id="f-source"><option>Website</option><option>Walk-in</option><option>Phone</option><option>WhatsApp</option><option>Education Fair</option><option>Campaign</option><option>Referral</option></select>
      </div>
      <div><label>Assign counsellor</label>
        <select id="f-counsellor"><option>Unassigned</option><option>Priya Menon</option><option>Arjun Rao</option><option>Divya Sharma</option><option>Kabir Singh</option></select>
      </div>
    </div>
    <div class="row" style="margin-top:12px;">
      <button class="btn-primary" onclick="addLead()">Add lead</button>
      <span class="small" id="form-msg"></span>
    </div>
  </div>

  <div class="panel">
    <h2>Pipeline</h2>
    <div class="filters">
      <select id="flt-status" onchange="render()">
        <option value="">All statuses</option>
        <option>New</option><option>Contacted</option><option>Follow-up</option><option>Converted</option><option>Lost</option>
      </select>
      <select id="flt-source" onchange="render()"><option value="">All sources</option></select>
      <select id="flt-counsellor" onchange="render()"><option value="">All counsellors</option></select>
      <input id="flt-search" placeholder="Search name or phone" oninput="render()">
      <button class="btn-ghost" onclick="clearFilters()">Clear</button>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Lead</th><th>Course</th><th>Source</th><th>Counsellor</th><th>Status</th><th>Age</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none;">No leads yet. Add one above to get started.</div>
    </div>
  </div>

</div>

<script>
const STATUSES=["New","Contacted","Follow-up","Converted","Lost"];
const SOURCES=["Website","Walk-in","Phone","WhatsApp","Education Fair","Campaign","Referral"];
const COUNSELLORS=["Unassigned","Priya Menon","Arjun Rao","Divya Sharma","Kabir Singh"];
let leads=[]; let openRow=null;

function load(){
  try{ leads = JSON.parse(localStorage.getItem('leads_v1')||'[]'); }
  catch(e){ leads=[]; }
}
function save(){
  try{ localStorage.setItem('leads_v1', JSON.stringify(leads)); }
  catch(e){ console.error('Save failed', e); }
}
function uid(){ return 'L'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function daysAgo(ts){ return Math.floor((Date.now()-ts)/86400000); }
function fmt(ts){ return new Date(ts).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }

function addLead(){
  const name=document.getElementById('f-name').value.trim();
  const phone=document.getElementById('f-phone').value.trim();
  const msg=document.getElementById('form-msg');
  if(!name||!phone){ msg.textContent='Name and phone are required.'; msg.style.color='var(--warn)'; return; }
  if(!/^[0-9+\-\s]{7,15}$/.test(phone)){ msg.textContent='Enter a valid phone number.'; msg.style.color='var(--warn)'; return; }
  const lead={
    id:uid(), name, phone,
    course:document.getElementById('f-course').value.trim()||'—',
    source:document.getElementById('f-source').value,
    counsellor:document.getElementById('f-counsellor').value,
    status:'New', createdAt:Date.now(),
    history:[{ts:Date.now(), note:'Lead created'}]
  };
  leads.unshift(lead); save();
  ['f-name','f-phone','f-course'].forEach(id=>document.getElementById(id).value='');
  msg.textContent='Lead added.'; msg.style.color='var(--ok)';
  setTimeout(()=>msg.textContent='',2000);
  render();
}

function setStatus(id, status){
  const l=leads.find(x=>x.id===id); if(!l) return;
  l.status=status; l.history.push({ts:Date.now(), note:'Status changed to '+status});
  save(); render();
}
function setCounsellor(id, c){
  const l=leads.find(x=>x.id===id); if(!l) return;
  l.counsellor=c; l.history.push({ts:Date.now(), note:'Reassigned to '+c});
  save(); render();
}
function addNote(id){
  const ta=document.getElementById('note-'+id);
  const text=ta.value.trim(); if(!text) return;
  const l=leads.find(x=>x.id===id);
  l.history.push({ts:Date.now(), note:text});
  save(); ta.value=''; render(true, id);
}
function toggleRow(id){ openRow = openRow===id ? null : id; render(true, id); }

function badgeClass(s){
  return {New:'b-new',Contacted:'b-contacted','Follow-up':'b-followup',Converted:'b-converted',Lost:'b-lost'}[s]||'b-new';
}

function populateFilterOptions(){
  const src=document.getElementById('flt-source'), cns=document.getElementById('flt-counsellor');
  if(src.options.length<=1){ SOURCES.forEach(s=>src.insertAdjacentHTML('beforeend',`<option>${s}</option>`)); }
  if(cns.options.length<=1){ COUNSELLORS.forEach(c=>cns.insertAdjacentHTML('beforeend',`<option>${c}</option>`)); }
}
function clearFilters(){
  document.getElementById('flt-status').value='';
  document.getElementById('flt-source').value='';
  document.getElementById('flt-counsellor').value='';
  document.getElementById('flt-search').value='';
  render();
}

function renderStats(){
  const total=leads.length;
  const byStatus=s=>leads.filter(l=>l.status===s).length;
  const hot=leads.filter(l=>['New','Contacted','Follow-up'].includes(l.status) && daysAgo(l.createdAt)>=3).length;
  const cards=[
    ['Total leads', total], ['New', byStatus('New')], ['Follow-up', byStatus('Follow-up')],
    ['Converted', byStatus('Converted')], ['Lost', byStatus('Lost')], ['Ageing (3+ days)', hot]
  ];
  document.getElementById('stats').innerHTML = cards.map(([l,n])=>`<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
}

function render(keepOpen, id){
  populateFilterOptions();
  renderStats();
  const fs=document.getElementById('flt-status').value;
  const fsrc=document.getElementById('flt-source').value;
  const fc=document.getElementById('flt-counsellor').value;
  const q=document.getElementById('flt-search').value.trim().toLowerCase();
  let list=leads.filter(l=>
    (!fs||l.status===fs) && (!fsrc||l.source===fsrc) && (!fc||l.counsellor===fc) &&
    (!q||l.name.toLowerCase().includes(q)||l.phone.includes(q))
  );
  const tbody=document.getElementById('tbody');
  document.getElementById('empty').style.display = list.length? 'none':'block';
  tbody.innerHTML = list.map(l=>{
    const age=daysAgo(l.createdAt);
    const ageCls = (age>=3 && !['Converted','Lost'].includes(l.status)) ? 'age-hot' : '';
    const statusOpts = STATUSES.map(s=>`<option ${s===l.status?'selected':''}>${s}</option>`).join('');
    const cnsOpts = COUNSELLORS.map(c=>`<option ${c===l.counsellor?'selected':''}>${c}</option>`).join('');
    let rows = `<tr>
      <td><strong>${escapeHtml(l.name)}</strong><br><span class="small">${escapeHtml(l.phone)}</span></td>
      <td>${escapeHtml(l.course)}</td>
      <td>${l.source}</td>
      <td><select onchange="setCounsellor('${l.id}',this.value)">${cnsOpts}</select></td>
      <td><span class="badge ${badgeClass(l.status)}">${l.status}</span><br>
          <select style="margin-top:4px;" onchange="setStatus('${l.id}',this.value)">${statusOpts}</select></td>
      <td class="${ageCls}">${age}d</td>
      <td><button class="link-btn" onclick="toggleRow('${l.id}')">${openRow===l.id?'Hide':'Notes'}</button></td>
    </tr>`;
    if(openRow===l.id){
      const hist=l.history.slice().reverse().map(h=>`<li>${fmt(h.ts)} — ${escapeHtml(h.note)}</li>`).join('');
      rows += `<tr class="expand"><td colspan="7">
        <ul class="hist">${hist}</ul>
        <div class="row">
          <div style="flex:1;min-width:200px;"><textarea id="note-${l.id}" placeholder="Add a follow-up note..."></textarea></div>
          <button class="btn-primary" onclick="addNote('${l.id}')">Save note</button>
        </div>
      </td></tr>`;
    }
    return rows;
  }).join('');
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

load(); render();
</script>
</body>
</html>
